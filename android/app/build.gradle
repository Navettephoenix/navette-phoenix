import groovy.json.JsonOutput

plugins {
    id 'com.android.application' version '9.1.1'
}
android {
    namespace = 'fr.navettephoenix.app'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId = 'com.phoenix.navette'
        minSdk = 26
        targetSdk = 37
        versionCode = 20
        versionName = '1.20'
        buildConfigField 'String', 'RESERVATION_URL', JsonOutput.toJson(providers.gradleProperty('navetteReservationUrl').orElse('').get())
        buildConfigField 'String', 'BOOKING_EMAIL', JsonOutput.toJson(providers.gradleProperty('navetteBookingEmail').orElse('').get())
        buildConfigField 'String', 'BOOKING_PHONE', JsonOutput.toJson(providers.gradleProperty('navetteBookingPhone').orElse('').get())
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
